name: Build and release frontend

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      MAP_INFRA_DISPATCH_TOKEN: ${{ secrets.MAP_INFRA_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must be vMAJOR.MINOR.PATCH (for example v1.2.3).'
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Validate Clerk publishable key
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [[ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]]; then
            echo '::error::Set VITE_CLERK_PUBLISHABLE_KEY in repository Actions secrets before building the frontend image.'
            exit 1
          fi
      - name: Validate deployment credentials
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$MAP_INFRA_DISPATCH_TOKEN" ]; then
            echo '::error::Set MAP_INFRA_DISPATCH_TOKEN with Contents write access to kaljo14/map-infra.'
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: kaljo14/my-map:${{ steps.version.outputs.version || 'latest' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      - name: Notify map-infra about the new image
        if: startsWith(github.ref, 'refs/tags/v') && env.MAP_INFRA_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.MAP_INFRA_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/kaljo14/map-infra/dispatches \
            -f event_type=image-pushed
      - name: Check out production infrastructure
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: kaljo14/map-infra
          ref: main
          path: map-infra
          token: ${{ secrets.MAP_INFRA_DISPATCH_TOKEN }}
      - name: Update frontend image digest for Flux
        if: github.ref == 'refs/heads/main'
        working-directory: map-infra
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re

          digest = os.environ["IMAGE_DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Build did not return a valid image digest")
          path = Path("apps/frontend/deployment.yaml")
          original = path.read_text()
          updated, count = re.subn(
              r"(?m)^(\s*image:\s*)kaljo14/my-map:[^\s]+$",
              lambda match: match[1] + "kaljo14/my-map:latest@" + digest,
              original,
          )
          if count != 1:
              raise SystemExit("Expected exactly one frontend image reference")
          path.write_text(updated)
          PYTHON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/deployment.yaml
          if git diff --cached --quiet; then
            echo 'Frontend already uses this image digest.'
            exit 0
          fi
          git commit -m "Deploy frontend from my-map ${SOURCE_SHA}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo '::error::Could not push the frontend digest to map-infra/main.'
          exit 1
