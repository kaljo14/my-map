version: '3'
services:
  frontend:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY in .env}
    ports:
      - '8888:80'
    environment:
      - PLACES_API_URL=http://host.docker.internal:8080
      - TILES_API_URL=http://host.docker.internal:4000
      - MARTIN_API_URL=http://host.docker.internal:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: always
