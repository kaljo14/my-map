version: '3.8'
services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "8888:8888"
    environment:
      - PLACES_API_URL=http://scraper:8080 # Internal docker URL
      - TILES_API_URL=http://tileserver:8080 # Internal docker URL
      - KEYCLOAK_URL=http://localhost:8081
      - CHOKIDAR_USEPOLLING=true 
    command: sh -c "npm install && npm run dev -- --host"
    restart: always
    depends_on:
      - tileserver
      - scraper

  tileserver:
    image: maptiler/tileserver-gl
    container_name: tileserver
    ports:
      - "4000:8080"
    volumes:
      - /Users/kaloyanivanov/Personal-SRV/apis/grid-service/tiles:/data
      - /Users/kaloyanivanov/Personal-SRV/apis/grid-service/config.json:/config.json
    command: "--config /config.json"

  db:
    image: postgres:16-alpine
    container_name: barbershop_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: barbershops
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d barbershops"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    container_name: barbershop_scraper
    build: /Users/kaloyanivanov/Personal-SRV/apis/places-scraper
    environment:
      - GOOGLE_PLACES_API_KEY=YOUR_API_KEY_HERE
      - POSTGRES_CONN_STRING=postgres://admin:mysecretpassword@db:5432/barbershops?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
